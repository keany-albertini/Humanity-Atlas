<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090808">
<title>Humanity Atlas — L'Arbre vivant du savoir humain</title>
<meta name="description" content="Humanity Atlas — explorer les connaissances humaines à travers un Arbre de Vie vivant, naturel et interactif.">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<main class="experience" id="experience">
  <div class="scene" aria-hidden="true">
    <div class="scene__bg" id="sceneBg"></div>
    <div class="scene__water" id="water"></div>
    <div class="scene__mist scene__mist--1"></div>
    <div class="scene__mist scene__mist--2"></div>
    <canvas id="ambientCanvas"></canvas>
    <div class="scene__shade"></div>
  </div>

  <header class="header">
    <a class="brand" href="#" aria-label="Humanity Atlas, accueil">
      <span class="brand__sigil" aria-hidden="true">
        <svg viewBox="0 0 52 52" fill="none">
          <path d="M26 42V22m0 2c-5-9-12-11-18-8 2 9 8 14 18 14m0-6c5-9 12-11 18-8-2 9-8 14-18 14M26 37c-5 0-10 3-14 8m14-8c5 0 10 3 14 8" stroke="currentColor" stroke-width="1.35"/>
          <circle cx="26" cy="13" r="2.5" stroke="currentColor" stroke-width="1.2"/>
        </svg>
      </span>
      <span>
        <strong>HUMANITY ATLAS</strong>
        <small>L'Arbre vivant du savoir humain</small>
      </span>
    </a>

    <nav class="nav" aria-label="Navigation principale">
      <button data-jump="tree">L'Arbre</button>
      <button data-jump="roots">Racines</button>
      <button data-jump="branches">Branches</button>
      <button data-jump="knowledge">Savoirs</button>
      <button data-jump="vision">Vision</button>
    </nav>

    <button class="enter" id="enterTop">Entrer <span>↗</span></button>
    <button class="menuToggle" id="menuToggle" aria-label="Ouvrir le menu">☰</button>
  </header>

  <section class="hero" id="tree">
    <div class="hero__eyebrow">UNE MÉMOIRE VIVANTE</div>
    <h1>Tout savoir<br>commence par <em>le vivant.</em></h1>
    <p>Comprendre la nature. Retrouver les savoirs.<br>Transmettre sans détruire.</p>
    <button class="cta" id="exploreBtn">
      <span>Explorer l'Arbre</span>
      <span class="cta__orb">↘</span>
    </button>
  </section>

  <section class="roots" id="roots" aria-label="Racines du savoir">
    <button class="knowledgeCard" data-topic="water">
      <span class="knowledgeCard__glow knowledgeCard__glow--water"></span>
      <span class="knowledgeCard__index">01</span>
      <span class="knowledgeCard__copy"><strong>Eau</strong><small>Source de vie</small></span>
      <span class="knowledgeCard__arrow">↗</span>
    </button>
    <button class="knowledgeCard" data-topic="fire">
      <span class="knowledgeCard__glow knowledgeCard__glow--fire"></span>
      <span class="knowledgeCard__index">02</span>
      <span class="knowledgeCard__copy"><strong>Feu</strong><small>Énergie & transformation</small></span>
      <span class="knowledgeCard__arrow">↗</span>
    </button>
    <button class="knowledgeCard" data-topic="soil">
      <span class="knowledgeCard__glow knowledgeCard__glow--soil"></span>
      <span class="knowledgeCard__index">03</span>
      <span class="knowledgeCard__copy"><strong>Sol</strong><small>Fondement du vivant</small></span>
      <span class="knowledgeCard__arrow">↗</span>
    </button>
    <button class="knowledgeCard" data-topic="nature">
      <span class="knowledgeCard__glow knowledgeCard__glow--nature"></span>
      <span class="knowledgeCard__index">04</span>
      <span class="knowledgeCard__copy"><strong>Nature</strong><small>Équilibre & relations</small></span>
      <span class="knowledgeCard__arrow">↗</span>
    </button>
  </section>

  <aside class="panel" id="panel" aria-hidden="true">
    <div class="panel__veil" data-close></div>
    <article class="panel__card">
      <button class="panel__close" data-close aria-label="Fermer">×</button>
      <div class="panel__kicker" id="panelKicker">Racine · 01</div>
      <h2 id="panelTitle">Eau</h2>
      <p class="panel__lead" id="panelLead"></p>
      <blockquote id="panelQuote"></blockquote>
      <div class="panel__facts" id="panelFacts"></div>
      <button class="panel__link" id="panelLink">Entrer dans ce savoir <span>→</span></button>
    </article>
  </aside>

  <div class="hint"><span class="hint__dot"></span><span>Déplacez doucement votre regard dans la scène</span></div>
  <div class="soundButton" id="soundButton" title="Ambiance sonore (à venir)" aria-label="Ambiance sonore">♪</div>
</main>
<script src="./script.js"></script>
</body>
</html>
